name: compile_and_test_papiex

on:
  push

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config_papiex_papi: ['y', 'n']
        config_papiex_debug: ['y', 'n']
    #service:
    #  - postgres:latest

    container:
      image: rockylinux:8
      options: --privileged

    steps:
      - uses: actions/checkout@v4
      - name: build env with yum install and update
        run: |
          yum update -y
          yum install -y gcc make file findutils

      - name: compile papiex
        run: |
          mkdir /build
          make OS_TARGET=rocky-8 CONFIG_PAPIEX_DEBUG==${{ matrix.config_papiex_debug }} CONFIG_PAPIEX_PAPI=${{ matrix.config_papiex_papi }} distclean install dist dist-test

      - name: setup test env after compiling with more yum etc
        run: |
          yum install -y gcc-c++ gcc-gfortran perl python3
          yum install -y tcsh bind-utils openssh-clients openssh-server
          yum install -y tcl environment-modules git

      - name: config test ssh keys
        run: |
          mkdir -p /var/run/sshd
          echo -e "ForwardX11 no\nStrictHostKeyChecking no\nPreferredAuthentications publickey" >> /etc/ssh/ssh_config
          # Generate all SSH host key types for testing purposes only.
          # This is acceptable in this controlled test environment.
          ssh-keygen -A
          # GitHub Actions containers override HOME (e.g. /github/home) so
          # use absolute paths to /root/.ssh which is where the OpenSSH
          # client and server resolve root's home via /etc/passwd.
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          ssh-keygen -t rsa -f /root/.ssh/id_rsa -q -N ""
          cat /root/.ssh/id_rsa.pub >> /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys

      - name: configure csh user
        run: |
          # Configure csh user allow root to log in to them
          useradd -m -s /bin/csh -pfoo cshuser
          mkdir ~cshuser/.ssh
          cp /root/.ssh/authorized_keys ~cshuser/.ssh/authorized_keys
          chmod 700 ~cshuser/.ssh/
          chmod 600 ~cshuser/.ssh/authorized_keys
          chown -R cshuser ~cshuser/.ssh

      - name: configure tcsh user
        run: |
          # Configure tcsh user
          useradd -m -s /usr/bin/tcsh -pfoo tcshuser
          mkdir ~tcshuser/.ssh
          cp /root/.ssh/authorized_keys ~tcshuser/.ssh/authorized_keys
          chmod 700 ~tcshuser/.ssh/
          chmod 600 ~tcshuser/.ssh/authorized_keys
          chown -R tcshuser ~tcshuser/.ssh

      - name: create init.sh and start sshd
        run: |
          # Remove nologin files that block SSH login via pam_nologin in containers
          rm -f /var/run/nologin /run/nologin /etc/nologin
          # Setup the environment, daemons and run the test script
          echo -e "#!/bin/bash\nrm -f /var/run/nologin /run/nologin /etc/nologin\nmount -o remount rw /proc\nsysctl -w kernel.perf_event_paranoid=0\n/usr/sbin/sshd 2>/dev/null || true\n\$*" > /tmp/init.sh && chmod 755 /tmp/init.sh
          cat /tmp/init.sh
          /usr/sbin/sshd
          # Verify SSH authentication works end-to-end
          ssh -v -o PreferredAuthentications=publickey localhost /bin/true
          echo "SSH publickey auth to localhost: OK"

      - name: make check papiex
        run: |
          echo 2 > /proc/sys/kernel/perf_event_paranoid
          make OS_TARGET=rocky-8 CONFIG_PAPIEX_DEBUG==${{ matrix.config_papiex_debug }} CONFIG_PAPIEX_PAPI=${{ matrix.config_papiex_papi }} check

      - name: run init.sh and call tests
        run: |
          echo "sourcing /tmp/init.sh and running test.sh"
          source /tmp/init.sh && papiex/src/tests/test.sh





