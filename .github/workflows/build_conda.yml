name: build_conda

on:
  pull_request:
    branches:

# cancel running jobs if there's a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up base Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: true

      - name: Configure conda channels
        run: |
          echo "removing conda default channels, appending open-source ones"
          conda config --append channels conda-forge
          conda config --append channels noaa-gfdl

          echo "setting strict channel priority"
          conda config --set channel_priority strict

          echo "setting anaconda_upload to no"
          conda config --set anaconda_upload no

          echo "printing conda config just in case"
          conda config --show

      - name: Update Conda and Conda Package Indices
        run: |
          echo "updating conda and package channel indices for conda-forge, noaa-gfdl"
          conda update -y --all --override-channels -c conda-forge
          conda update -y --all --override-channels -c noaa-gfdl

      - name: Install conda-build
        run: |
          conda install -y conda-forge::conda-build

      - name: Install test dependencies
        run: |
          # tcsh provides both tcsh and csh executables, needed by the test suite
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcsh

      - name: Enable perf_event for tests
        run: |
          # perf_event_paranoid=2 allows user-space perf counter collection,
          # required for PAPI to function (matches compile_and_test_papiex.yml)
          sudo sysctl -w kernel.perf_event_paranoid=2

      - name: Build papiex conda package
        run: |
          echo "conda building papiex package and outputting as a tarball"
          mkdir -p /tmp/papiex-tarball
          conda build --package-format tar.bz2 --output-folder /tmp/papiex-tarball .

      - name: Upload papiex tarball
        uses: actions/upload-artifact@v4
        with:
          name: papiex-tarball
          path: /tmp/papiex-tarball/linux-64/papiex-*.tar.bz2
          if-no-files-found: error
