name: create_test_conda_env

on:
  pull_request:
    branches:

  push:
    branches:
      - main

# cancel running jobs if there's a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda-env-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        # bash -l is required so that conda activate works inside run: steps
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # conda-incubator/setup-miniconda supports Miniforge via miniforge-version.
      # Miniforge ships with conda-forge as its only default channel (open-source,
      # community-maintained). This avoids any dependency on Anaconda-proprietary
      # channels or packages entirely.
      - name: Set up Miniforge environment from environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: true
          environment-file: environment.yml
          activate-environment: papiex

      - name: Show installed packages
        run: |
          echo "conda info is:"
          conda info

          echo "printing installed packages"
          conda list

          echo "printing conda config just in case"
          conda config --show

      - name: Verify papi is available
        run: |
          echo "checking that papi shared library is present in the environment"
          test -f "$CONDA_PREFIX/lib/libpapi.so" && echo "libpapi.so found" || echo "libpapi.so not found (may be OK on some platforms)"
          ls -la "$CONDA_PREFIX/lib"/libpapi* || true
          ls -la "$CONDA_PREFIX/lib"/libpfm* || true

      - name: Install test dependencies
        run: |
          # tcsh provides both tcsh and csh, needed by the test suite
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcsh

      - name: Enable perf_event for tests
        run: |
          # perf_event_paranoid=2 allows user-space perf counter collection,
          # required for PAPI to function (matches compile_and_test_papiex.yml)
          sudo sysctl -w kernel.perf_event_paranoid=2

      - name: Build papiex from source
        run: |
          # Build libmonitor from vendored source (not yet on conda-forge)
          cd monitor
          ./configure --prefix="$CONDA_PREFIX" --disable-link-static
          make install
          cd ..

          # Build papiex against conda-provided papi + vendored libmonitor
          cd papiex
          make CC="${CC:-gcc}" OCC="${CC:-gcc}" \
               CONFIG_PAPIEX_PAPI=y \
               CONFIG_PAPIEX_DEBUG=n \
               MONITOR_INC_PATH="$CONDA_PREFIX/include" \
               MONITOR_LIB_PATH="$CONDA_PREFIX/lib" \
               PAPI_INC_PATH="$CONDA_PREFIX/include" \
               PAPI_LIB_PATH="$CONDA_PREFIX/lib" \
               PREFIX="$CONDA_PREFIX" \
               install

      - name: Run papiex tests
        run: |
          cd papiex/src/tests
          PAPIEX_PREFIX="$CONDA_PREFIX" bash test.sh
